# 待确认：实际 Win7 账户、NTFS 共享目录、监听端口和配置目录。
# 歧义：此样例尚未在 Win7 SP1 的 Cygwin Samba 服务端运行验证。
# 后续研究：双用户身份切换、ACL 拒绝、服务启动及 445 端口冲突。
# 潜在优化：部署后按实际局域网接口设置 interfaces 和 hosts allow。
# 风险：请先替换账户与路径；本文件仅为模板，不包含任何凭据。
# 验证重点：testparm、SMB2+/签名、NTLMv2 与拒绝匿名。
[global]
   server role = standalone server
   security = user
   passdb backend = tdbsam
   unix password sync = no
   private dir = %$(SAMBA_PORTABLE_ROOT)/private
   state directory = %$(SAMBA_PORTABLE_ROOT)/state
   cache directory = %$(SAMBA_PORTABLE_ROOT)/cache
   lock directory = %$(SAMBA_PORTABLE_ROOT)/lock
   pid directory = %$(SAMBA_PORTABLE_ROOT)/run
   ncalrpc dir = %$(SAMBA_PORTABLE_ROOT)/rpc
   map to guest = Never
   null passwords = no
   interfaces = 127.0.0.1 ::1
   bind interfaces only = yes
   smb ports = 445
   hosts allow = 127.0.0.1 ::1
   hosts deny = ALL
   hostname lookups = no
   server min protocol = SMB2_10
   server max protocol = SMB3_11
   server signing = mandatory
   ntlm auth = ntlmv2-only
   server smb encrypt = if_required
   server multi channel support = no
   rpc start on demand helpers = no
   disable netbios = yes
   load printers = no
   disable spoolss = yes

[data]
   path = /cygdrive/c/SambaShare
   valid users = REPLACE_WITH_WRITER REPLACE_WITH_READER
   write list = REPLACE_WITH_WRITER
   guest ok = no
   read only = yes
   browseable = no

# Add other shares explicitly, with their own path, valid users and write list.
# Never expose the portable root or its private/state/cache/lock/run/rpc directories.
# Add only trusted client IPv4/IPv6 addresses to hosts allow, and server addresses to interfaces.
