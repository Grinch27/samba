# Shared Samba configuration: Docker / Ubuntu / Cygwin.
# Candidate: testparm and Windows file access still require validation.
# Use the same POSIX /smb path on all hosts; map storage outside this file.
# Initial installation listens on loopback only. Change the initial password
# before explicitly configuring trusted LAN interfaces and client addresses.
[global]
    workgroup = WORKGROUP
    server string = Samba Server
    server role = standalone server

    interfaces = 127.0.0.1 ::1
    bind interfaces only = yes
    hosts allow = 127.0.0.1 ::1
    hosts deny = ALL
    hostname lookups = no

    security = user
    passdb backend = tdbsam
    # Public login root maps to an unprivileged local account on every host.
    username map = /etc/samba/smbusers
    map to guest = never
    null passwords = no
    ntlm auth = ntlmv2-only
    unix password sync = no

    server min protocol = SMB2_10
    server max protocol = SMB3_11
    server signing = mandatory
    server smb encrypt = if_required
    server multi channel support = no
    # Pending: verify Cygwin RPC helper compatibility.
    rpc start on demand helpers = no

    disable netbios = yes
    smb ports = 445
    load printers = no
    disable spoolss = yes

    # Explicit POSIX layout independent of the compiler's installation prefix.
    state directory = /var/lib/samba
    private dir = /var/lib/samba/private
    cache directory = /var/cache/samba
    lock directory = /run/samba
    pid directory = /run/samba
    ncalrpc dir = /run/samba/ncalrpc

    log level = 1
    log file = /var/log/samba/%m.log
    max log size = 10
    deadtime = 15

    strict locking = auto
    oplocks = yes
    level2 oplocks = yes

    # Optional performance settings: test before enabling.
    # aio read size = 1
    # aio write size = 1
    # use sendfile = yes

[smb]
    comment = Samba Share
    path = /smb
    browseable = yes
    read only = no
    guest ok = no
    # Access checks use the mapped local identity, not the client login alias.
    valid users = smbshare
    create mask = 0664
    directory mask = 0775
    ea support = yes
    store dos attributes = yes
    # WIN7_COMPAT: NTFS probe rejected EA names ending in :$DATA.
    # Full streams_xattr behavior remains unverified; opt in after validation.
    # vfs objects = streams_xattr
    veto files = /.DS_Store/Thumbs.db/
