# 待确认：Cygwin 3.4.10 的真实 SYSTEM 身份映射及 Samba 权限切换。
# 歧义：Server 2022 探针不等于 Win7 实机验收；此处仍用完整构建环境研究。
# 后续研究：合法管理员身份、最小运行闭包、Setup 原生 samba-win7 包。
# 潜在优化：直接复用同批编译与依赖 Artifact，避免重复 Waf 构建。
# 风险：仅信任本仓库 main 已编译输入；身份实验仅临时 GitHub-hosted Runner，不发布。
# 验证重点：独立 Setup 根、四工具启动、正式配置解析及实际 SID/UID。
name: Samba managed deployment research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/win7-managed-deployment-research.yml
      - research/cygwin-legacy/runtime-closure.py
      - research/cygwin-legacy/system-identity-probe.ps1
      - deployment/smb.conf
      - deployment/smbusers
  workflow_run:
    workflows: ["Samba smbd Cygwin 3.4.10 Win7 research"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing legacy build Run ID (empty selects latest available main artifact)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  runner-image:
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve.outputs.RUNNER_IMAGE }}
    steps:
      - id: resolve
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  select:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      refresh: ${{ steps.source.outputs.refresh }}
    steps:
      - name: Select existing compiled inputs
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run="$SOURCE_RUN"
          if [[ -z "$run" ]]; then
            run=$(gh api "repos/$repo/actions/artifacts?name=samba-win7-compiled-inputs&per_page=100" |
              jq -er '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.repository_id == .workflow_run.head_repository_id)] | sort_by(.created_at) | last | .workflow_run.id')
          fi
          [[ "$run" =~ ^[0-9]+$ ]]
          meta=$(gh api "repos/$repo/actions/runs/$run")
          source_ref=$(jq -er 'select(.head_branch == "main" and .head_repository.id == .repository.id and (.path | startswith(".github/workflows/win7-cygwin-legacy-smbd.yml"))) | .head_sha' <<< "$meta")
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          artifacts=$(gh api "repos/$repo/actions/runs/$run/artifacts")
          jq -e 'any(.artifacts[]; .name == "samba-win7-compiled-inputs" and .expired == false)' <<< "$artifacts" >/dev/null
          refresh=true
          if jq -e 'any(.artifacts[]; .name == "cygwin-build-inputs" and .expired == false and (.expires_at | fromdateiso8601) > (now + 1200))' <<< "$artifacts" >/dev/null; then
            refresh=false
          fi
          printf 'run_id=%s\nsource_ref=%s\nrefresh=%s\n' "$run" "$source_ref" "$refresh" >> "$GITHUB_OUTPUT"
          printf 'Reusing compiled Run %s; refresh fixed dependencies: %s\n' "$run" "$refresh"

  dependencies:
    needs: [runner-image, select]
    if: ${{ needs.select.outputs.refresh == 'true' }}
    uses: ./.github/workflows/prepare-cygwin-dependencies.yml
    with:
      runner_image: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
      source_ref: ${{ needs.select.outputs.source_ref }}
    permissions:
      contents: read

  runtime-closure:
    needs: [runner-image, select, dependencies]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped') }}
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve compiled provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: samba-win7-compiled-inputs
          path: ${{ runner.temp }}/compiled-samba
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run_id }}
      - name: Retrieve original fixed inputs
        if: ${{ needs.select.outputs.refresh == 'false' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cygwin-build-inputs
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run_id }}
      - name: Retrieve refreshed fixed inputs
        if: ${{ needs.select.outputs.refresh == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cygwin-build-inputs
          path: ${{ runner.temp }}
      - name: Plan runtime dependency closure from signed metadata
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/runtime-metadata"
          mkdir -p "$work"
          export GNUPGHOME="$work/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          mirror=https://mirrors.kernel.org/sourceware/cygwin
          curl -fsSL --retry 2 --max-time 60 https://cygwin.com/key/pubring.asc -o "$work/pubring.asc"
          curl -fsSL --retry 2 --max-time 60 "$mirror/x86_64/setup.xz" -o "$work/setup.xz"
          curl -fsSL --retry 2 --max-time 60 "$mirror/x86_64/setup.xz.sig" -o "$work/setup.xz.sig"
          gpg --batch --import "$work/pubring.asc"
          gpg --batch --status-fd 1 --verify "$work/setup.xz.sig" "$work/setup.xz" > "$work/signature.txt"
          grep -E '^\[GNUPG:\] VALIDSIG .*56405CF6FCC81574682A5D561A698DE9E2E56300( |$)' "$work/signature.txt"
          python3 research/cygwin-legacy/runtime-closure.py \
            --historical "$RUNNER_TEMP/cygwin-cache/historical/x86_64/setup.ini" \
            --modern "$work/setup.xz" \
            --providers "$RUNNER_TEMP/compiled-samba/runtime-package-candidates.json" \
            --output "$RUNNER_TEMP/runtime-closure.json"
      - name: Save closure candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samba-runtime-closure-candidate
          path: |
            ${{ runner.temp }}/runtime-closure.json
            ${{ runner.temp }}/runtime-metadata/signature.txt
          if-no-files-found: warn
          retention-days: 1

  managed:
    needs: [select, dependencies]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Retrieve compiled Samba
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: samba-win7-compiled-inputs
          path: ${{ runner.temp }}/compiled-samba
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run_id }}
      - name: Retrieve same-build Cygwin inputs
        if: ${{ needs.select.outputs.refresh == 'false' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cygwin-build-inputs
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run_id }}
      - name: Retrieve refreshed fixed Cygwin inputs
        if: ${{ needs.select.outputs.refresh == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cygwin-build-inputs
          path: ${{ runner.temp }}
      - name: Install independent Cygwin research root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Samba'
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin-cache'
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          $selected = (Get-Content (Join-Path $cache 'selected-packages.txt') -Raw).Trim()
          $arguments = @('--quiet-mode', '--verbose', '--local-install', '--no-admin', '--no-verify', '--no-shortcuts', '--no-desktop', '--root', ('"{0}"' -f $root), '--local-package-dir', ('"{0}"' -f $cache), '--packages', $selected)
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Offline setup failed: $($process.ExitCode)" }
          $compiled = Join-Path $env:RUNNER_TEMP 'compiled-samba'
          python research/cygwin-legacy/overlay-packages.py (Join-Path $compiled 'packages.tsv') (Join-Path $env:RUNNER_TEMP 'cygwin-overlay') --root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content (Join-Path $compiled 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files | Where-Object origin -eq 'samba') {
            $name = Split-Path -Leaf $entry.path
            Copy-Item -LiteralPath (Join-Path $compiled $entry.path) -Destination (Join-Path $root "bin/$name")
          }
          New-Item -ItemType Directory -Force (Join-Path $root 'etc/samba'), (Join-Path $root 'smb') | Out-Null
          Copy-Item deployment/smb.conf, deployment/smbusers (Join-Path $root 'etc/samba')
      - name: Record real account identity and load shared configuration
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Samba'
          $bash = Join-Path $root 'bin/bash.exe'
          $report = Join-Path $env:RUNNER_TEMP 'managed-identity.txt'
          whoami.exe /user | Tee-Object -FilePath $report
          whoami.exe /priv | Tee-Object -FilePath $report -Append
          $command = @'
          set -e
          export PATH=/usr/bin:/bin
          # Create only the new isolated runtime directories before testparm.
          install -d -m 0755 /var/lib/samba /var/cache/samba /run/samba /var/log/samba
          install -d -m 0700 /var/lib/samba/private /run/samba/ncalrpc
          uname -r
          id
          printf '\nCurrent identity:\n'
          getent passwd "$(id -u)" || true
          printf '\nUID 0 and SYSTEM UID 18:\n'
          getent passwd 0 || true
          getent passwd 18 || true
          printf '\nSamba build paths:\n'
          smbd -b | sed -n '/^Paths:/,/^System Headers:/p'
          smbd --version
          testparm --version
          smbcontrol --version
          printf '\nShared configuration:\n'
          testparm -s /etc/samba/smb.conf
          '@
          & $bash --noprofile --norc -c ($command -replace "`r`n", "`n") 2>&1 | Tee-Object -FilePath $report -Append
          exit $LASTEXITCODE
      - name: Identify runtime package providers
        shell: pwsh
        run: |
          python research/cygwin-legacy/runtime-packages.py --manifest (Join-Path $env:RUNNER_TEMP 'compiled-samba/manifest.json') --historical (Join-Path $env:RUNNER_TEMP 'cygwin-cache') --overlay (Join-Path $env:RUNNER_TEMP 'cygwin-overlay') --lock (Join-Path $env:RUNNER_TEMP 'compiled-samba/packages.tsv') --root (Join-Path $env:RUNNER_TEMP 'Samba') --expected (Join-Path $env:RUNNER_TEMP 'compiled-samba/runtime-package-candidates.json') --output (Join-Path $env:RUNNER_TEMP 'runtime-package-candidates.json')
          exit $LASTEXITCODE
      - name: Test real SYSTEM account initialization and restricted NTFS identity
        shell: pwsh
        timeout-minutes: 4
        run: |
          & research/cygwin-legacy/system-identity-probe.ps1 -Root (Join-Path $env:RUNNER_TEMP 'Samba') -Report (Join-Path $env:RUNNER_TEMP 'system-identity-probe.txt')
      - name: Save managed deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samba-managed-deployment-evidence
          path: |
            ${{ runner.temp }}/managed-identity.txt
            ${{ runner.temp }}/runtime-package-candidates.json
            ${{ runner.temp }}/system-identity-probe.txt
          if-no-files-found: warn
          retention-days: 1
