# 待确认：旧 Cygwin 编译器及基础依赖是否完成 Samba 4.25.1 配置。
# 歧义：Server 2022 构建不代表 Win7 可正确运行和切换 NTFS 身份。
# 后续研究：Win7 VM 上的 SMB2+/签名、IPC 和双用户权限验收。
# 潜在优化：冷编译成功后测量缓存及 Heimdal 路线。
# 风险：历史镜像无索引签名，必须校验固定索引与包；直接解包不执行通用安装器脚本。
# 验证重点：3.4.10 ABI、Waf 配置、smbd 及辅助工具构建。
name: Samba smbd Cygwin 3.4.10 Win7 research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/win7-cygwin-legacy-smbd.yml
      - research/cygwin-legacy/verify-cache.py
      - research/cygwin-legacy/package-smbd.py
      - research/cygwin-legacy/overlay-packages.py
      - research/cygwin-legacy/prepare-release.py
      - research/cygwin-legacy/sample-smb.conf
      - research/cygwin-legacy/overlay.sh
      - research/cygwin-legacy/packages.tsv
      - research/probe-cygwin-smbd.sh
      - research/cygwin-vfs-compat.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-smbd:
    name: Samba 4.25.1 on Cygwin 3.4.10 x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CYGWIN_PACKAGES: bison,cygwin-devel,curl,diffutils,flex,gcc-core,git,libcrypt-devel,libiconv-devel,libintl-devel,libpopt-devel,libreadline-devel,libtasn1-devel,libtirpc-devel,make,perl,pkg-config,python3,python39,rpcsvc-proto,zlib-devel,zstd
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - name: Check out research scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Download and verify pinned historical packages
        shell: pwsh
        timeout-minutes: 10
        run: |
          python research/cygwin-legacy/verify-cache.py --download (Join-Path $env:RUNNER_TEMP 'cygwin-cache') $env:CYGWIN_PACKAGES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified historical Cygwin packages offline
        shell: pwsh
        timeout-minutes: 15
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          $root = Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10'
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin-cache'
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 180 --output $setup 'https://cygwin.com/setup-x86_64.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arguments = @('--quiet-mode', '--local-install', '--no-admin', '--no-verify', '--no-shortcuts', '--no-desktop', '--root', ('"{0}"' -f $root), '--local-package-dir', ('"{0}"' -f $cache), '--packages', $env:CYGWIN_PACKAGES)
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          Write-Host "Cygwin setup exit: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Offline setup failed" }
          $bash = Join-Path $root 'bin/bash.exe'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw "Offline setup did not install bash.exe" }
          & $bash --noprofile --norc -c 'set -e; export PATH=/usr/bin:/bin; uname -r; gcc --version; python3 --version; perl -v'
          if ($LASTEXITCODE -ne 0) { throw "Historical toolchain check failed" }
          $version = & $bash --noprofile --norc -c '/usr/bin/uname -r'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^3\.4\.10') { throw "Unexpected Cygwin version: $version" }
      - name: Save installer logs
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'smbd-legacy-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $logs = Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10/var/log'
          if (Test-Path $logs) {
            Get-ChildItem -LiteralPath $logs -Filter 'setup.log*' -File | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $evidence ("installer-" + $_.Name))
            }
          }
      - name: Overlay pinned libraries without running Cygwin
        shell: pwsh
        timeout-minutes: 5
        run: |
          python research/cygwin-legacy/overlay-packages.py (Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10') research/cygwin-legacy/packages.tsv (Join-Path $env:RUNNER_TEMP 'cygwin-overlay')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Parse Yapp
        shell: pwsh
        run: |
          $bash = Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10/bin/bash.exe'
          $command = @'
          project=$(/usr/bin/cygpath -u "$GITHUB_WORKSPACE")
          evidence=$(/usr/bin/cygpath -u "$RUNNER_TEMP/smbd-legacy-evidence")
          exec /usr/bin/bash "$project/research/cygwin-legacy/overlay.sh" "$evidence"
          '@
          & $bash --noprofile --norc -c ($command -replace "`r`n", "`n")
          exit $LASTEXITCODE
      - name: Build smbd and companion tools
        shell: pwsh
        timeout-minutes: 76
        run: |
          $bash = Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10/bin/bash.exe'
          $command = @'
          set -euo pipefail
          project=$(/usr/bin/cygpath -u "$GITHUB_WORKSPACE")
          evidence=$(/usr/bin/cygpath -u "$RUNNER_TEMP/smbd-legacy-evidence")
          export PERL5LIB="$evidence/Parse-Yapp-1.21/lib"
          export SAMBA_NONSHARED_BINARIES=smbd/smbd,testparm,smbpasswd
          /usr/bin/bash "$project/research/probe-cygwin-smbd.sh" "$evidence/build"
          cd "$evidence/build/upstream-samba"
          PYTHONHASHSEED=1 WAF_MAKE=1 timeout --kill-after=15s 15m \
            ./buildtools/bin/waf build --targets=testparm,smbpasswd -j 4 \
            2>&1 | tee "$evidence/tools-build.log"
          '@
          & $bash --noprofile --norc -c ($command -replace "`r`n", "`n")
          exit $LASTEXITCODE
      - name: Prepare complete three-program DLL package
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'smbd-legacy-evidence/build/upstream-samba'
          $cygwin = Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10'
          $output = Join-Path $env:RUNNER_TEMP 'samba-win7-3.4.10-package'
          python research/cygwin-legacy/package-smbd.py --source-root $source --cygwin-root $cygwin --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate portable programs and prepare corresponding source
        shell: pwsh
        timeout-minutes: 15
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'smbd-legacy-evidence/build/upstream-samba'
          $package = Join-Path $env:RUNNER_TEMP 'samba-win7-3.4.10-package'
          $bin = Join-Path $package 'bin'
          Copy-Item research/cygwin-legacy/sample-smb.conf (Join-Path $package 'smb.conf')
          $previous = $env:PATH
          try {
            $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
            foreach ($name in @('smbd.exe', 'testparm.exe', 'smbpasswd.exe')) {
              & (Join-Path $bin $name) --version
              if ($LASTEXITCODE -ne 0) { throw "Portable startup failed: $name" }
            }
            & (Join-Path $bin 'testparm.exe') -s (Join-Path $package 'smb.conf')
            if ($LASTEXITCODE -ne 0) { throw 'Sample configuration rejected' }
          } finally { $env:PATH = $previous }
          python research/cygwin-legacy/prepare-release.py --cache (Join-Path $env:RUNNER_TEMP 'cygwin-cache') --overlay (Join-Path $env:RUNNER_TEMP 'cygwin-overlay') --packages research/cygwin-legacy/packages.tsv --samba $source --project $env:GITHUB_WORKSPACE --package $package --output (Join-Path $env:RUNNER_TEMP 'samba-release')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload complete portable package and corresponding sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samba-win7-preview-release
          path: ${{ runner.temp }}/samba-release/
          if-no-files-found: error
          retention-days: 7
      - name: Collect executable and DLL diagnostics
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'smbd-legacy-evidence'
          $bin = Join-Path $evidence 'build/upstream-samba/bin'
          $out = Join-Path $evidence 'binaries'
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path $bin) {
            foreach ($name in @('smbd.exe', 'testparm.exe', 'smbpasswd.exe')) {
              $file = Get-ChildItem -LiteralPath $bin -Filter $name -File -Recurse | Select-Object -First 1
              if ($file) {
                Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $out $name)
                & (Join-Path $env:RUNNER_TEMP 'cygwin-3.4.10/bin/cygcheck.exe') $file.FullName 2>&1 | Out-File -Encoding utf8 (Join-Path $evidence "$name-dependencies.txt")
              }
            }
          }
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smbd-cygwin-3.4.10-x64-research
          path: |
            ${{ runner.temp }}/smbd-legacy-evidence/build/summary.md
            ${{ runner.temp }}/smbd-legacy-evidence/build/configure-tail.txt
            ${{ runner.temp }}/smbd-legacy-evidence/build/build-tail.txt
            ${{ runner.temp }}/smbd-legacy-evidence/build/smbd-dlls.txt
            ${{ runner.temp }}/smbd-legacy-evidence/tools-build.log
            ${{ runner.temp }}/smbd-legacy-evidence/*-dependencies.txt
            ${{ runner.temp }}/smbd-legacy-evidence/installer-*
          if-no-files-found: warn
          retention-days: 7

  prerelease:
    name: Publish first portable ZIP preview
    needs: legacy-smbd
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: samba-win7-preview1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.25.1-cygwin3.4.10-preview1
    steps:
      - name: Download verified release assets
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name samba-win7-preview-release --dir release
          cd release
          sha256sum -c SHA256SUMS
          test -s samba-4.25.1-cygwin-3.4.10-x64.zip
          test -s samba-corresponding-source.zip
      - name: Create first experimental pre-release
        run: |
          set -euo pipefail
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '.[] | select(.tagName == env.TAG) | .isDraft')
          if [[ "$existing" == false ]]; then
            echo 'First preview already exists; no overwrite.'
            exit 0
          fi
          if [[ "$existing" == true ]]; then
            echo 'Existing draft requires recovery; refusing overwrite.' >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'Samba 4.25.1 Cygwin 3.4.10 x64 experimental preview' --notes 'Portable ZIP and corresponding-source ZIP. Built and startup-checked on Windows Server 2022; Windows 7 SP1, NTFS account isolation and service behavior are not validated. Not a production release. SMB 2.1+; mandatory signing; NTLMv2; encryption optional.' release/*.zip release/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
